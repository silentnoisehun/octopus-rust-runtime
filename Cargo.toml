[package]
name = "octopus-runtime"
version = "2.9.0"
edition = "2021"
description = "Standalone native Rust blade runtime for Octopus orchestration"
license = "MIT"
repository = "https://github.com/silentnoisehun/octopus-rust-runtime"
homepage = "https://github.com/silentnoisehun/octopus-rust-runtime"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
chrono = "0.4"
dirs = "6"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
qrcode = { version = "0.14", features = ["svg"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
csv = "1.3"
whoami = "1.4"


# Microscope Memory enforcement module: the commitment gate the Octopus
# native runtime consults before invoking any blade.
microscope-memory = { git = "https://github.com/silentnoisehun/microscope-memory.git", rev = "1a3126baaf452744237adbbb1094cdce46c1de87", default-features = false, features = ["native"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1

[profile.test]
debug = 0
incremental = false

[profile.test.build-override]
debug = 0
incremental = false
